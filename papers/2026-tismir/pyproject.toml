[project]
name = "mpb-corpus-2026-tismir"
version = "1.0.0"
description = "Analysis environment for the 2026 TISMIR paper on the MPB Corpus"
requires-python = ">=3.14,<3.15"
license = "CC-BY-4.0"
dependencies = [
    "abjad>=3.19",
    "ipython>=9.13",
    "matplotlib>=3.10",
    "numpy>=2.4",
    "pandas>=3.0",
    "scipy>=1.17",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
]

[tool.uv]
package = false
